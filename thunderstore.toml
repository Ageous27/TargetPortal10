[config]
schemaVersion = "0.0.1"

[package]
namespace = "Ageous27"
name = "TargetPortal10"
versionNumber = "1.3.0"
description = "Unofficial Valheim 1.0.12 fork of TargetPortal. Map-click any portal; favorites use middle-click."
websiteUrl = "https://github.com/Ageous27/TargetPortal10"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2350"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "./TargetPortal/bin/Release/merged/TargetPortal.dll"
target = "/"

[[build.copy]]
source = "./CHANGELOG.md"
target = "/"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["mods"]